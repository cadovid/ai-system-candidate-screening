name: Live evaluations

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Provider model to evaluate"
        required: true
        default: groq:openai/gpt-oss-20b
        type: choice
        options:
          - openai:gpt-5.6-luna
          - openrouter:deepseek/deepseek-v4-flash:free
          - groq:openai/gpt-oss-20b
      budget_usd:
        description: "Operator-approved spend threshold (USD; workflow check only, not a provider billing cap)"
        required: true
        default: "1.00"
        type: string
      run_synthetic_eval:
        description: "Also run the longer synthetic conversation evaluation"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  live-evals:
    name: Run live evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_DATA_COLLECTION: deny
      OPENROUTER_ZDR: "true"
      LLM_MODEL: ${{ inputs.model }}
    steps:
      - name: Guard secret, model, and approval threshold
        env:
          REQUESTED_MODEL: ${{ inputs.model }}
          REQUESTED_BUDGET_USD: ${{ inputs.budget_usd }}
          MAX_APPROVAL_THRESHOLD_USD: "5.00"
        run: |
          set -eu
          case "${REQUESTED_MODEL}" in
            openai:gpt-5.6-luna)
              if [ -z "${OPENAI_API_KEY}" ]; then
                echo "OPENAI_API_KEY is not configured for the selected live evaluation" >&2
                exit 1
              fi
              ;;
            openrouter:deepseek/deepseek-v4-flash:free)
              if [ -z "${OPENROUTER_API_KEY}" ]; then
                echo "OPENROUTER_API_KEY is not configured for the selected live evaluation" >&2
                exit 1
              fi
              ;;
            groq:openai/gpt-oss-20b)
              if [ -z "${GROQ_API_KEY}" ]; then
                echo "GROQ_API_KEY is not configured for the selected live evaluation" >&2
                exit 1
              fi
              ;;
            *)
              echo "The requested model is not in the live-evaluation allowlist" >&2
              exit 1
              ;;
          esac
          python - "${REQUESTED_BUDGET_USD}" "${MAX_APPROVAL_THRESHOLD_USD}" <<'PY'
          import sys
          from decimal import Decimal, InvalidOperation

          try:
              budget = Decimal(sys.argv[1])
              maximum = Decimal(sys.argv[2])
          except (InvalidOperation, IndexError):
              raise SystemExit("budget_usd must be a decimal amount")
          if budget <= 0 or budget > maximum:
              raise SystemExit(f"budget_usd must be greater than 0 and at most {maximum}")
          print("Approved threshold is an operator gate only; provider billing is not capped by this workflow.")
          PY

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          version: 2.28.0
          cache: true

      - name: Install locked development dependencies
        run: pdm install --dev --frozen-lockfile

      - name: Run live provider contract smoke
        env:
          RUN_LIVE_PROVIDER_CONTRACT: "1"
        run: pdm run pytest tests/live/test_provider_contract.py -m live

      - name: Run optional synthetic conversation evaluation
        if: ${{ inputs.run_synthetic_eval }}
        run: >-
          pdm run python scripts/run_evals.py --mode live --json --fail-on-error
          --case-id multi_field_first_answer
